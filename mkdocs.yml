site_name: Grokbot Harness
site_description: Build, operate, and maintain Grokbot Harness.
site_url: !ENV [GBH_DOCS_SITE_URL, "https://river-li.github.io/brok-pot-harness/"]
repo_url: !ENV [GBH_DOCS_REPOSITORY_URL, "https://github.com/river-li/brok-pot-harness"]
repo_name: !ENV [GBH_DOCS_REPOSITORY, "river-li/brok-pot-harness"]
edit_uri: edit/main/
docs_dir: .runtime/docs-site/src
site_dir: .runtime/docs-site/site

copyright: Grokbot Harness

theme:
  name: material
  language: en
  font: false
  logo: assets/branding/icon.png
  favicon: assets/branding/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: custom
    accent: custom

markdown_extensions:
  - toc:
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - tables
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: gbh-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11.17.2/dist/mermaid.min.js
  - docs/assets/javascripts/mermaid-init.js

extra_css:
  - docs/assets/stylesheets/site.css

extra:
  generator: false

nav:
  - Start here:
      - Overview: README.md
      - Installation and first task: docs/wiki/Build-Guide.md
      - Remote server and desktop: docs/wiki/Remote-Server.md
      - Configuration: docs/wiki/Configuration.md
      - Features: docs/wiki/Features.md
      - Troubleshooting: docs/wiki/Troubleshooting.md
  - Project:
      - Architecture: docs/wiki/Architecture.md
      - Documentation Home: docs/wiki/Home.md
      - Simplified Chinese: README.zh.md
      - Packaging: docs/wiki/Packaging.md
      - Contributions: CONTRIBUTING.md
  - Workspace Setup:
      - Sandbox and Data: docs/wiki/Sandbox.md
      - Permissions: docs/wiki/Permissions.md
      - MCP, Plugins, and Skills: docs/wiki/Extensions.md
  - Engineering:
      - Development: docs/wiki/Development.md
      - Source Recovery: docs/wiki/Source-Recovery.md
      - Verification: docs/wiki/Verification.md
      - Issue Triage: docs/wiki/Issue-Triage.md
      - Publish Docs and Wiki: docs/wiki/Publishing.md
      - Package Map (component guide): packages/README.md
      - Renderer Guide: runtime/renderer-src/README.md
      - Host Extension Map (component guide): src/host/extensions/README.md
