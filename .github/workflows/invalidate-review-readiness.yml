name: Invalidate stale review readiness

on:
  pull_request_target:
    types: [synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: review-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  invalidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Remove stale review labels
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 tools/maintenance_workflow/invalidate_labels.py
