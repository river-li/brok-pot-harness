name: Documentation site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: python3 -m pip install -r docs/requirements-pages.txt

      - name: Validate authored documentation links
        run: npm run docs:check

      - name: Validate wiki exporter behavior
        run: python3 -m unittest discover -s tools -p 'test_wiki.py'

      - name: Build documentation website
        run: npm run docs:site:build

      - name: Verify Markdown inside README details blocks
        run: python3 -m unittest discover -s tools -p 'test_docs_site_markdown.py'

      - name: Verify allowlisted Pages artifact
        run: npm run docs:site:verify

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .runtime/docs-site/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
